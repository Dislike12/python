name: Project checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Lint new projects
        run: ruff check projects tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile project files
        run: python -m compileall -q projects tests
